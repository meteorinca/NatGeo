<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geography Quiz</title>
    <meta name="description" content="Interactive geography quiz - learn countries, capitals, and more!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Fireworks Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <div class="app-container">
        <!-- Header with Stats -->
        <header class="header">
            <div class="header-left">
                <h1 id="quiz-title">🌎 Geography Quiz</h1>
            </div>
            <div class="stats-bar">
                <div class="stat-item timer-stat">
                    <span class="stat-icon">⏱️</span>
                    <span class="stat-value" id="timer">0:00</span>
                </div>
                <div class="stat-item score-stat">
                    <span class="stat-icon">⭐</span>
                    <span class="stat-value"><span id="current-score">0</span> pts</span>
                </div>
                <div class="stat-item progress-stat">
                    <span class="stat-icon">📍</span>
                    <span class="stat-value"><span id="current-question">0</span>/<span
                            id="total-questions">0</span></span>
                </div>
            </div>
        </header>

        <!-- Question Panel -->
        <div class="question-panel" id="question-panel">
            <div class="points-badge" id="points-badge">
                <span class="points-value">3</span>
                <span class="points-label">points</span>
            </div>
            <div class="question-content">
                <span class="question-prefix">Where is</span>
                <span class="question-target" id="question-target">...</span>
                <span class="question-suffix">?</span>
            </div>
            <div class="attempts-indicator" id="attempts-indicator">
                <span class="attempt-dot active"></span>
                <span class="attempt-dot active"></span>
                <span class="attempt-dot active"></span>
            </div>
        </div>

        <!-- Feedback Message -->
        <div class="feedback-message" id="feedback-message">
            <span class="feedback-icon">❌</span>
            <span class="feedback-text">Whoops! That's not it.</span>
            <span class="attempts-left">2 tries left</span>
        </div>

        <!-- Map Section -->
        <main class="map-section">
            <div class="map-container" id="map-container">
                <img src="" alt="Map" class="relief-map" id="relief-map">

                <!-- SVG Overlay for clickable regions -->
                <svg class="country-overlay" id="country-overlay" preserveAspectRatio="xMidYMid meet">
                    <!-- Regions loaded dynamically -->
                </svg>
            </div>
        </main>

        <!-- Map Selection Screen -->
        <div class="start-screen" id="start-screen">
            <div class="start-content">
                <div class="start-icon">🌍</div>
                <h2>Geography Quiz</h2>
                <p>Choose a map to start learning!</p>

                <div class="map-grid" id="map-grid">
                    <!-- Maps loaded dynamically -->
                    <div class="loading-maps">Loading available maps...</div>
                </div>
            </div>
        </div>

        <!-- Victory Modal -->
        <div class="victory-modal" id="victory-modal">
            <div class="victory-content">
                <div class="victory-icon">🎉</div>
                <h2>Quiz Complete!</h2>
                <div class="final-stats">
                    <div class="final-stat">
                        <span class="final-stat-value" id="final-score">0</span>
                        <span class="final-stat-label">Points</span>
                    </div>
                    <div class="final-stat">
                        <span class="final-stat-value" id="final-time">0:00</span>
                        <span class="final-stat-label">Time</span>
                    </div>
                    <div class="final-stat">
                        <span class="final-stat-value" id="final-accuracy">0%</span>
                        <span class="final-stat-label">Accuracy</span>
                    </div>
                </div>
                <p class="victory-message" id="victory-message">Great job!</p>
                <div class="victory-buttons">
                    <button class="btn btn-primary" id="play-again-btn">
                        <span class="btn-icon">🔄</span> Play Again
                    </button>
                    <button class="btn btn-secondary" id="choose-map-btn">
                        <span class="btn-icon">🗺️</span> Choose Map
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
